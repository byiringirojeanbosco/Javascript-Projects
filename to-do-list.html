<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font: DM Sans -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* Apply custom font globally */
    body {
      font-family: 'DM Sans', sans-serif;
    }

    /* Smooth slide-in animation for new tasks */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-item {
      animation: slideIn 0.25s ease-out;
    }
  </style>
</head>

<body class="min-h-screen bg-amber-50 flex items-center justify-center px-4 py-10">

  <!-- ===== MAIN CARD ===== -->
  <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-amber-100">

    <!-- Card Header -->
    <div class="bg-amber-400 px-6 py-6">
      <h1 class="text-2xl font-bold text-white tracking-tight">My To-Do List</h1>
      <p class="text-amber-100 text-sm mt-1">Stay organized, stay productive.</p>
    </div>

    <!-- Card Body -->
    <div class="px-6 py-6">

      <!-- ===== INPUT SECTION ===== -->
      <div class="flex gap-2 mb-6">
        <!-- Task input field -->
        <input
          id="taskInput"
          type="text"
          placeholder="Write a new task..."
          class="flex-1 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-700
                 focus:outline-none focus:ring-2 focus:ring-amber-300 focus:border-transparent
                 placeholder-gray-400 bg-gray-50"
        />

        <!-- Add button -->
        <button
          id="addBtn"
          class="bg-amber-400 hover:bg-amber-500 active:scale-95 text-white font-semibold
                 text-sm px-5 py-2.5 rounded-xl transition-all duration-150 whitespace-nowrap"
        >
          + Add
        </button>
      </div>

      <!-- Error message (hidden by default) -->
      <p id="errorMsg" class="text-red-500 text-xs mb-4 hidden">
         Please enter a task before adding.
      </p>

      <!-- Task Counter -->
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-widest">Tasks</h2>
        <span id="taskCount" class="text-xs bg-amber-100 text-amber-700 font-semibold px-2.5 py-1 rounded-full">
          0 task(s)
        </span>
      </div>

      <!-- ===== TASK LIST ===== -->
      <!-- Tasks will be injected here dynamically via JavaScript -->
      <ul id="taskList" class="space-y-2">
        <!-- Empty state shown when no tasks exist -->
        <li id="emptyState" class="text-center text-gray-400 text-sm py-8">
         No tasks yet. Add one above!
        </li>
      </ul>

    </div><!-- End Card Body -->
  </div><!-- End Card -->


  <!-- ===================================================
       JAVASCRIPT — All DOM manipulation happens here
  ==================================================== -->
  <script>
    // -----------------------------------------------
    // 1. GET REFERENCES TO IMPORTANT HTML ELEMENTS
    // -----------------------------------------------
    const taskInput  = document.getElementById('taskInput');   // The text input
    const addBtn     = document.getElementById('addBtn');       // The "Add" button
    const taskList   = document.getElementById('taskList');     // The <ul> list
    const taskCount  = document.getElementById('taskCount');    // Task counter badge
    const errorMsg   = document.getElementById('errorMsg');     // Error message paragraph
    const emptyState = document.getElementById('emptyState');   // "No tasks" message

    // -----------------------------------------------
    // 2. TRACK TASKS IN AN ARRAY (data store)
    // -----------------------------------------------
    let tasks = [];  // Each task: { id, text, completed }

    // -----------------------------------------------
    // 3. FUNCTION: Render all tasks to the DOM
    //    Called every time tasks array changes
    // -----------------------------------------------
    function renderTasks() {
      // Remove all existing task <li> elements (keep emptyState)
      const existingItems = taskList.querySelectorAll('.task-item');
      existingItems.forEach(item => item.remove());

      // Show or hide empty state
      if (tasks.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
      }

      // Update task counter badge
      taskCount.textContent = `${tasks.length} task(s)`;

      // Loop through tasks and create a list item for each
      tasks.forEach(task => {
        // --- Create the <li> element ---
        const li = document.createElement('li');
        li.className = `task-item flex items-center justify-between gap-3 bg-gray-50
                        border border-gray-100 rounded-xl px-4 py-3 group`;
        li.dataset.id = task.id; // Store task id on the element

        // --- Left side: checkbox + task text ---
        const leftDiv = document.createElement('div');
        leftDiv.className = 'flex items-center gap-3 flex-1 min-w-0';

        // Checkbox to toggle completion
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.completed;
        checkbox.className = 'w-4 h-4 accent-amber-400 cursor-pointer flex-shrink-0';

        // Listen for checkbox click → toggle completed state
        checkbox.addEventListener('change', function () {
          toggleTask(task.id);
        });

        // Task text span
        const span = document.createElement('span');
        span.textContent = task.text;
        span.className = `text-sm text-gray-700 truncate transition-all duration-200
                          ${task.completed ? 'line-through text-gray-400' : ''}`;

        leftDiv.appendChild(checkbox);
        leftDiv.appendChild(span);

        // --- Right side: Remove button ---
        const removeBtn = document.createElement('button');
        removeBtn.textContent = '✕';
        removeBtn.className = `text-gray-300 hover:text-red-500 text-sm font-bold
                               flex-shrink-0 transition-colors duration-150
                               opacity-0 group-hover:opacity-100`;
        removeBtn.title = 'Remove task';

        // Listen for remove button click → delete this task
        removeBtn.addEventListener('click', function () {
          removeTask(task.id);
        });

        // --- Assemble the list item ---
        li.appendChild(leftDiv);
        li.appendChild(removeBtn);

        // Append to the task list
        taskList.appendChild(li);
      });
    }

    // -----------------------------------------------
    // 4. FUNCTION: Add a new task
    // -----------------------------------------------
    function addTask() {
      const text = taskInput.value.trim(); // Get input value (trimmed)

      // Validation: prevent empty tasks
      if (text === '') {
        errorMsg.classList.remove('hidden'); // Show error
        taskInput.focus();
        return; // Stop here
      }

      // Hide error if it was showing
      errorMsg.classList.add('hidden');

      // Create a new task object
      const newTask = {
        id: Date.now(),      // Unique ID based on timestamp
        text: text,          // Task text from input
        completed: false     // Not completed yet
      };

      // Add to the tasks array
      tasks.push(newTask);

      // Clear the input field
      taskInput.value = '';
      taskInput.focus();

      // Re-render the list
      renderTasks();
    }

    // -----------------------------------------------
    // 5. FUNCTION: Toggle task completed/incomplete
    // -----------------------------------------------
    function toggleTask(id) {
      // Find the task by id and flip its 'completed' value
      tasks = tasks.map(task =>
        task.id === id ? { ...task, completed: !task.completed } : task
      );

      // Re-render the list
      renderTasks();
    }

    // -----------------------------------------------
    // 6. FUNCTION: Remove a task permanently
    // -----------------------------------------------
    function removeTask(id) {
      // Filter out the task with the matching id
      tasks = tasks.filter(task => task.id !== id);

      // Re-render the list
      renderTasks();
    }

    // -----------------------------------------------
    // 7. EVENT LISTENERS
    // -----------------------------------------------

    // Clicking the "Add" button → add task
    addBtn.addEventListener('click', addTask);

    // Pressing Enter in the input field → add task
    taskInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        addTask();
      }
    });

    // Typing in input → hide error message instantly
    taskInput.addEventListener('input', function () {
      errorMsg.classList.add('hidden');
    });

    // -----------------------------------------------
    // 8. INITIAL RENDER (empty state on page load)
    // -----------------------------------------------
    renderTasks();
  </script>

</body>
</html>
